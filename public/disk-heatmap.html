<script>
// All disk figures live here. Replace only DATA when integrating a future scan.
const DATA = {
  categories: [
    { key: 'user', color: '#83958C', label: '用户文件' },
    { key: 'system', color: '#9BA6AC', label: '系统' },
    { key: 'apps', color: '#B8AA94', label: '应用' },
    { key: 'data', color: '#A39DAA', label: '系统数据' },
    { key: 'other', color: '#B8BAB5', label: '其他' }
  ],
  disks: [
    { id: 'C:', name: '系统盘', totalGB: 512, usedGB: 356, freeGB: 156, values: [123, 111, 63, 41.5, 17.5] },
    { id: 'D:', name: '工作盘', totalGB: 1024, usedGB: 640, freeGB: 384, values: [280, 64, 160, 96, 40] },
    { id: 'F:', name: '资料盘', totalGB: 512, usedGB: 180, freeGB: 332, values: [76, 58, 24, 16, 6] }
  ]
};
function validateData(data) {
  if (!data || !Array.isArray(data.categories) || data.categories.length !== 5 || !Array.isArray(data.disks) || data.disks.length !== 3) throw new Error('DATA 必须包含 5 个分类、3 块磁盘。');
  if (new Set(data.categories.map(c => c.key)).size !== data.categories.length || new Set(data.disks.map(d => d.id)).size !== data.disks.length) throw new Error('分类或磁盘标识重复。');
  for (const disk of data.disks) {
    if (!Array.isArray(disk.values) || disk.values.length !== data.categories.length || [...disk.values, disk.totalGB, disk.usedGB, disk.freeGB].some(v => !Number.isFinite(v) || v < 0) || disk.totalGB <= 0) throw new Error(`${disk.id} 数据格式不正确。`);
    const sum = disk.values.reduce((a, b) => a + b, 0);
    if (Math.abs(sum - disk.usedGB) > 1e-9) throw new Error(`${disk.id} 分类合计 ${sum} GB 不等于已用 ${disk.usedGB} GB。`);
    if (Math.abs(disk.usedGB + disk.freeGB - disk.totalGB) > 1e-9) throw new Error(`${disk.id} 已用与可用之和不等于总容量。`);
  }
  return true;
}
try { validateData(DATA); window.DATA_VALID = true; } catch (error) { window.DATA_ERROR = error.message; }
</script>

const numberFormat = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });
const fmt = value => numberFormat.format(value);
const totalUsed = window.DATA_VALID ? DATA.disks.reduce((sum, disk) => sum + disk.usedGB, 0) : 0;
const allCells = window.DATA_VALID ? DATA.disks.flatMap((disk, row) => DATA.categories.map((category, column) => ({ id: `${disk.id}-${category.key}`, disk, category, row, column, gb: disk.values[column], diskPercent: disk.values[column] / disk.totalGB * 100, totalPercent: disk.values[column] / totalUsed * 100 }))) : [];
const fullest = window.DATA_VALID ? DATA.disks.reduce((a, b) => a.usedGB / a.totalGB > b.usedGB / b.totalGB ? a : b) : null;
const largest = window.DATA_VALID ? allCells.reduce((a, b) => a.gb > b.gb ? a : b) : null;
if(window.DATA_VALID) {
document.getElementById('total-used').textContent = fmt(totalUsed);
document.getElementById('fullest-percent').textContent = (fullest.usedGB / fullest.totalGB * 100).toFixed(1) + '%';
document.getElementById('fullest-label').textContent = `最满磁盘 · ${fullest.id.replace(':', '')} 盘`;
document.getElementById('largest-value').textContent = fmt(largest.gb);
document.getElementById('largest-label').textContent = `最大单项 · ${largest.disk.id.replace(':', '')} 盘·${largest.category.label}`;
} else { document.querySelector('.statistics').style.display='none';document.querySelector('.toolbar').style.display='none'; }
function sendData() { if (window.parent !== window && window.DATA_VALID) window.parent.postMessage({type:'disk-heatmap:ready',data:DATA},'*'); }
window.addEventListener('message', event => { if (event.source === window.parent && event.data?.type === 'disk-heatmap:init') sendData(); });
sendData();
if (!window.DATA_VALID) { const status=document.getElementById('stage-status');status.classList.add('error');status.setAttribute('role','alert');status.textContent='数据校验失败：'+window.DATA_ERROR; }
</script>

  function hit(event){const rect=renderer.domElement.getBoundingClientRect();pointer.set((event.clientX-rect.left)/rect.width*2-1,-(event.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);const result=raycaster.intersectObjects(bars.map(bar=>bar.mesh),false)[0];return result?bars.find(bar=>bar.id===result.object.userData.id):null;}
  renderer.domElement.addEventListener('pointerdown',event=>{activePointers.add(event.pointerId);if(activePointers.size===1){down={x:event.clientX,y:event.clientY};moved=false;}else moved=true;});
  renderer.domElement.addEventListener('pointermove',event=>{
    if(down&&Math.hypot(event.clientX-down.x,event.clientY-down.y)>5)moved=true;
    if(activePointers.size||cameraTween){tooltip.hidden=true;return;}
    const bar=hit(event);hovered=bar?.id||null;styling();if(!bar){tooltip.hidden=true;return;}
    tooltip.replaceChildren();const name=document.createElement('strong');name.textContent=`${bar.disk.id} ${bar.disk.name} · ${bar.category.label}`;const value=document.createElement('span');value.textContent=metric==='gb'?fmt(bar.gb)+' GB':bar.diskPercent.toFixed(2)+'%';tooltip.append(name,value);tooltip.hidden=false;
    const rect=stage.getBoundingClientRect();lastTooltip={x:event.clientX-rect.left,y:event.clientY-rect.top};tooltip.style.left=Math.min(width-tooltip.offsetWidth-10,Math.max(10,lastTooltip.x+12))+'px';tooltip.style.top=Math.min(height-tooltip.offsetHeight-10,Math.max(10,lastTooltip.y-45))+'px';
  });
  renderer.domElement.addEventListener('pointerup',event=>{activePointers.delete(event.pointerId);if(!moved&&down&&activePointers.size===0&&!cameraTween){const bar=hit(event);if(bar)select(bar);}if(!activePointers.size)down=null;});
  renderer.domElement.addEventListener('pointercancel',event=>{activePointers.delete(event.pointerId);down=null;moved=true;});renderer.domElement.addEventListener('pointerleave',()=>{tooltip.hidden=true;hovered=null;styling();});controls.addEventListener('change',()=>{dirty=true;});
  window.addEventListener('message',event=>{if(event.source!==window.parent)return;const data=event.data;if(data?.type==='disk-heatmap:state'){query=typeof data.query==='string'?data.query:'';const nextDisk=DATA.disks.some(d=>d.id===data.activeDisk)?data.activeDisk:activeDisk;if(nextDisk!==activeDisk&&selected&&bars.find(b=>b.id===selected)?.disk.id!==nextDisk){selected=null;document.getElementById('detail').hidden=true;setView(view);}activeDisk=nextDisk;styling();}});
  function placeLabels(){
    for(const item of labels){const projected=item.position.clone().project(camera);const margin=item.element.offsetWidth/2+5;item.element.style.left=Math.max(margin,Math.min(width-margin,(projected.x*.5+.5)*width))+'px';item.element.style.top=Math.max(16,Math.min(height-16,(-projected.y*.5+.5)*height))+'px';item.element.style.visibility=Math.abs(projected.x)>1||Math.abs(projected.y)>1||projected.z>1||projected.z< -1?'hidden':'visible';
      item.element.textContent=width<520?(item.type==='disk'?item.text.replace(' ',''):item.text.length===4?item.text.slice(0,2)+'\n'+item.text.slice(2):item.text):item.text;
    }
  }
  function resize(){const rect=stage.getBoundingClientRect();width=Math.max(1,rect.width);height=Math.max(1,rect.height);renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();if(!selected)setView(view,true);dirty=true;}
  const observer=new ResizeObserver(resize);observer.observe(stage);updateMetric('gb',true);resize();styling();document.getElementById('stage-status').hidden=true;
  const ease=t=>1-Math.pow(1-t,3);
  function animate(now){
    if(metricTween){const t=metricTween.duration?Math.min(1,(now-metricTween.start)/metricTween.duration):1;const e=ease(t);for(const entry of metricTween.values){entry.bar.group.scale.y=THREE.MathUtils.lerp(entry.fromHeight,entry.toHeight,e);entry.bar.mesh.material.color.lerpColors(entry.fromColor,entry.toColor,e);}dirty=true;if(t===1)metricTween=null;}
    if(cameraTween){const t=cameraTween.duration?Math.min(1,(now-cameraTween.start)/cameraTween.duration):1;const e=ease(t);camera.position.lerpVectors(cameraTween.fromPosition,cameraTween.toPosition,e);controls.target.lerpVectors(cameraTween.fromTarget,cameraTween.toTarget,e);dirty=true;if(t===1){cameraTween=null;controls.enabled=true;}}
    if(controls.update())dirty=true;
    if(dirty){placeLabels();renderer.render(scene,camera);dirty=false;}
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
  // Read-only state supports embedding diagnostics and verifies values actually rendered by WebGL.
  window.diskHeatmap=Object.freeze({snapshot:()=>({view,metric,selected,animating:!!(cameraTween||metricTween),camera:camera.position.toArray(),target:controls.target.toArray(),bars:bars.map(bar=>{const point=new THREE.Vector3(bar.group.position.x,bar.group.scale.y+.015,bar.group.position.z).project(camera);const rect=stage.getBoundingClientRect();return{id:bar.id,diskId:bar.disk.id,category:bar.category.label,gb:bar.gb,diskPercent:bar.diskPercent,totalPercent:bar.totalPercent,height:bar.group.scale.y,color:bar.mesh.material.color.getHexString(),screen:{x:rect.left+(point.x*.5+.5)*width,y:rect.top+(-point.y*.5+.5)*height}};})})});
  if(window.parent!==window)window.parent.postMessage({type:'disk-heatmap:request-state'},'*');
  window.addEventListener('pagehide',()=>{observer.disconnect();controls.dispose();geometry.dispose();edgeGeometry.dispose();bars.forEach(bar=>{bar.mesh.material.dispose();bar.edge.material.dispose();});renderer.dispose();},{once:true});
}
if(window.DATA_VALID)boot().catch(error=>{const status=document.getElementById('stage-status');status.hidden=false;status.classList.add('error');status.setAttribute('role','alert');status.textContent='3D 图形未能加载，请检查网络或 WebGL 支持后刷新。';window.HEATMAP_LOAD_ERROR=error.message;});
</script>
